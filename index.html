<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="提示詞庫">
<meta name="theme-color" content="#f2f4f8">
<title>AI Prompt Hub · 手機版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* 強制 debug 樣式 */
#app {
  background: #f2f4f8 !important;
  padding-top: 0 !important;
}
.app-header {
  background: #0c0f14 !important;
  max-height: 200px !important;
  overflow: hidden !important;
  padding-top: env(safe-area-inset-top, 0px) !important;
}
.app-hero, .app-search-bar-row, .app-hero-quote-above {
  flex-shrink: 0 !important;
}
/* 防止任何子元素撐開 header */
.app-header * {
  max-height: none;
}
</style>
</head>
<body>

<!-- ══ App Shell ═══════════════════════════════════════════ -->
<div id="app">

  <!-- Header -->
  <header class="app-header" style="display:flex;flex-direction:column;flex-shrink:0;">
    <div style="padding:6px 16px 2px;background:#0c0f14;">
      <p style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#94a3b8;letter-spacing:.1em;text-transform:uppercase;margin:0 0 2px;">PROMPT HUB &middot; 張萬權 | wonchen.chang@gmail.com</p>
      <p style="font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;color:#d4e8e4;margin:0 0 1px;line-height:1.2;">AI 提示詞分享與應用學習平台</p>
      <p style="font-size:10px;color:#f5c842;margin:0 0 2px;">AI 提示詞模組庫</p>
    </div>
    <div style="padding:2px 12px 5px;background:#0c0f14;">
      <div class="app-search-inner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋提示詞名稱、說明或內容…" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="search-clear" id="searchClear" style="display:none;">&#x2715;</button>
      </div>
    </div>
    <div id="searchOverlay" style="display:none;"><div class="search-bar-wrap"></div></div>
  </header>

  <!-- Category Tabs -->
  <div class="cat-tabs-wrap" id="catTabsWrap">
        <div class="cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="all">全部 <span class="cat-tab-count" id="count-all">147</span></button>
      <button class="cat-tab" data-cat="preset">⚙️ AI工具設定</button>
      <button class="cat-tab" data-cat="decision">📊 決策分析</button>
      <button class="cat-tab" data-cat="proposal">📋 企劃提案</button>
      <button class="cat-tab" data-cat="project">🗂️ 專案管理</button>
      <button class="cat-tab" data-cat="comms">💼 職場溝通</button>
      <button class="cat-tab" data-cat="writing">✍️ 文稿優化</button>
      <button class="cat-tab" data-cat="ai_roles">🧠 策略智囊</button>
      <button class="cat-tab" data-cat="industry">📈 產業分析</button>
      <button class="cat-tab" data-cat="sales">💰 行銷銷售</button>
      <button class="cat-tab" data-cat="research">🔬 研究分析</button>
      <button class="cat-tab" data-cat="routine">📅 日常效率</button>
      <button class="cat-tab" data-cat="learning">🎓 學習成長</button>
      <button class="cat-tab" data-cat="life">✨ 生活娛樂</button>
      <button class="cat-tab" data-cat="creative">🎨 簡報與視覺</button>
      <button class="cat-tab" data-cat="patent">⚖️ 專利分析</button>
    </div>
  </div>

  <!-- 主內容區（首頁卡片 / 最近 / 收藏 共用同一個容器） -->
  <div class="content-area" id="contentArea">
    <!-- 首頁卡片清單 -->
    <div class="card-list" id="cardGrid"></div>
    <!-- 最近使用（動態插入） -->
    <div class="view-panel" id="recentPanel"></div>
    <!-- 收藏（動態插入） -->
    <div class="view-panel" id="favPanel"></div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar">
    <button class="tab-bar-btn active" data-view="home" onclick="switchView('home',this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首頁</span>
    </button>
    <button class="tab-bar-btn" data-view="recent" onclick="switchView('recent',this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>最近使用</span>
    </button>
    <button class="tab-bar-btn" data-view="fav" onclick="switchView('fav',this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>收藏</span>
    </button>
  </nav>

</div><!-- /#app -->

<!-- ══ Detail Sheet ════════════════════════════════════════ -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="detail-sheet" id="detailSheet">
  <div class="sheet-handle-area" id="sheetHandleArea">
    <div class="sheet-handle"></div>
  </div>
  <div class="sheet-header">
    <button class="sheet-back" id="sheetBack">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sheet-title-wrap">
      <span class="sheet-cat-tag" id="sheetCat"></span>
      <h2 class="sheet-title" id="sheetTitle"></h2>
    </div>
    <button class="sheet-fav-btn" id="sheetFav">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="sheet-scene" id="sheetScene" style="display:none;"></div>
    <div class="prompt-block">
      <div class="prompt-label">完整提示詞</div>
      <pre class="prompt-text" id="sheetContent"></pre>
    </div>
    <div class="cases-section" id="sheetCases"></div>
  </div>
  <div class="sheet-footer">
    <button class="copy-main-btn" id="copyMainBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      複製提示詞
    </button>
    <span class="copy-count-badge" id="copyCountBadge"></span>
    <span class="copy-toast" id="copyToast"></span>
  </div>
</div>

<script src="data.js"></script>
<script src="cases.js"></script>
<script src="app.js"></script>
</body>
</html>
